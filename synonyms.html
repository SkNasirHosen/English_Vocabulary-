{w:"Absurd",pos:"Adj.",pr:"ab-SURD",prBn:"অ্যাবসার্ড",mEn:"Wildly unreasonable or illogical",mBn:"চরম অযৌক্তিক বা অসংগত; উদ্ভট, বেতুকা।",exEn:"It is absurd to expect full marks without any practice.",exBn:"কোনো অনুশীলন ছাড়া পুরো নম্বর আশা করা উদ্ভট।",syn:[["Ridiculous","হাস্যকর"],["Irrational","অযৌক্তিক"],["Silly","নির্বোধ"],["Foolish","বোকামিপূর্ণ"],["Senseless","অর্থহীন"],["Unreasonable","অযৌক্তিক"]],ant:[["Sensible","বিবেচক"],["Reasonable","যুক্তিসংগত"],["Realistic","বাস্তবসম্মত"],["Rational","যুক্তিবাদী"]],useBn:"যে কথা বা কাজ যুক্তির সম্পূর্ণ বাইরে, তার জন্য ব্যবহার করুন।",trickBn:"AB-SURD: SUR (সুর) থেকে দূরে, মানে বেসুরো। যুক্তির সুর কেটে গেছে, তাই উদ্ভট।",etEn:"From Latin absurdus, meaning out of tune or senseless.",etBn:"লাতিন absurdus থেকে, যার অর্থ বেসুরো বা অর্থহীন।",trap:{w:"Absorb",en:"Starts alike, but means to soak up.",bn:"শুরুটা এক, কিন্তু মানে শুষে নেওয়া।"},ssc:15,oth:8},
{w:"Amiable",pos:"Adj.",pr:"AY-mee-uh-buhl",prBn:"এমিয়েবল",mEn:"Having or displaying a friendly and pleasant manner",mBn:"বন্ধুত্বপূর্ণ ও মনোরম আচরণ আছে এমন; মিশুক।",exEn:"Her amiable nature made her popular with everyone.",exBn:"তার মিশুক স্বভাব তাকে সবার প্রিয় করে তুলেছিল।",syn:[["Friendly","বন্ধুসুলভ"],["Good-Natured","ভালো স্বভাবের"],["Pleasant","মনোরম"],["Harmonious","সামঞ্জস্যপূর্ণ"],["Cordial","আন্তরিক"]],ant:[["Hostile","শত্রুভাবাপন্ন"],["Unfriendly","অমিশুক"],["Disagreeable","অপ্রীতিকর"]],useBn:"হাসিখুশি, মিশুক ও আন্তরিক মানুষের বর্ণনায় ব্যবহার করুন।",trickBn:"AMI = বন্ধু (ফরাসি)। Amiable মানে বন্ধুর মতো মিশুক। উল্টো দিকে Hostile = শত্রু।",etEn:"From Latin amicabilis, from amicus, meaning friend.",etBn:"লাতিন amicabilis থেকে, amicus মানে বন্ধু।",trap:{w:"Amenable",en:"Looks alike, but means willing to accept or agree.",bn:"দেখতে কাছাকাছি, কিন্তু মানে রাজি বা সম্মত।"},ssc:9,oth:14},
{w:"Erudite",pos:"Adj.",pr:"ER-yuh-dyt",prBn:"ইরুডাইট",mEn:"Having or showing great knowledge or learning",mBn:"গভীর জ্ঞান বা পাণ্ডিত্য আছে এমন; বিদ্বান।",exEn:"The erudite professor answered every question with ease.",exBn:"বিদ্বান অধ্যাপক সহজেই প্রতিটি প্রশ্নের উত্তর দিলেন।",syn:[["Scholarly","পাণ্ডিত্যপূর্ণ"],["Learned","জ্ঞানী"],["Knowledgeable","জ্ঞানসম্পন্ন"],["Educated","শিক্ষিত"]],ant:[["Unscholarly","অবিদ্বান"],["Ignorant","অজ্ঞ"],["Uninformed","বেখবর"]],useBn:"বই-পড়া গভীর জ্ঞানী ও পণ্ডিত মানুষ বোঝাতে ব্যবহার করুন।",trickBn:"E-RUDE-ite: RUDE (রুক্ষ, অমার্জিত) থেকে E (বাইরে)। রুক্ষতা কেটে গেছে যার, সে পণ্ডিত।",etEn:"From Latin eruditus, e (out of) + rudis (rough): polished by learning.",etBn:"লাতিন eruditus থেকে, e (বাইরে) + rudis (রুক্ষ): শিক্ষায় মার্জিত।",trap:{w:"Eradicate",en:"Looks alike, but means to destroy completely.",bn:"দেখতে কাছাকাছি, কিন্তু মানে সমূলে নির্মূল করা।"},ssc:14,oth:9},
{w:"Baffle",pos:"V.",pr:"BAF-uhl",prBn:"ব্যাফল",mEn:"To confuse or puzzle someone; to hinder or prevent from achieving a goal",mBn:"কাউকে হতবুদ্ধি বা ধাঁধায় ফেলা; লক্ষ্যে পৌঁছাতে বাধা দেওয়া।",exEn:"The tricky question baffled even the best students.",exBn:"কঠিন প্রশ্নটি সেরা ছাত্রদেরও ধাঁধায় ফেলে দিল।",syn:[["Puzzle","ধাঁধায় ফেলা"],["Perplex","বিভ্রান্ত করা"],["Confuse","হতবুদ্ধি করা"]],ant:[["Enlighten","আলোকিত করা, স্পষ্ট করা"],["Facilitate","সহজ করা"]],useBn:"কোনো সমস্যা বা প্রশ্ন যখন কাউকে ধাঁধায় ফেলে, তখন ব্যবহার করুন।",trickBn:"BAFFLE ≈ ব্যা-ফেল: মাথা ব্যা (হতবাক) হয়ে ফেল, ধাঁধায় আটকে যাওয়া।",etEn:"Origin uncertain, possibly from French or Scots, meaning to disgrace or deceive.",etBn:"উৎস অনিশ্চিত, সম্ভবত ফরাসি বা স্কটিশ থেকে, যার অর্থ প্রতারিত বা অপদস্থ করা।",trap:{w:"Raffle",en:"Rhymes, but it is a lottery-style draw.",bn:"মিল আছে, কিন্তু raffle মানে লটারির মতো ড্র।"},ssc:20,oth:2},
{w:"Eccentric",pos:"Adj.",pr:"ik-SEN-trik",prBn:"ইকসেন্ট্রিক",mEn:"Unconventional and slightly strange",mBn:"প্রচলিত ধারার বাইরে ও কিছুটা অদ্ভুত; খামখেয়ালি।",exEn:"The eccentric scientist wore mismatched socks every day.",exBn:"খামখেয়ালি বিজ্ঞানী রোজ আলাদা আলাদা জোড়ার মোজা পরতেন।",syn:[["Queer","অদ্ভুত"],["Peculiar","বিশেষ ধরনের"],["Bizarre","বিচিত্র"],["Idiosyncratic","স্বকীয় বৈশিষ্ট্যপূর্ণ"],["Unconventional","অপ্রচলিত"],["Abnormal","অস্বাভাবিক"],["Strange","অদ্ভুত"]],ant:[["Customary","প্রথাগত"],["Normal","স্বাভাবিক"],["Conventional","প্রচলিত"]],useBn:"যার আচরণ বা পোশাক সবার থেকে আলাদা ও খামখেয়ালি, তার জন্য ব্যবহার করুন।",trickBn:"EX-CENTRIC: ex = বাইরে, centre = কেন্দ্র। সবার কেন্দ্র থেকে সরে যে চলে, সে খামখেয়ালি।",etEn:"From Greek ekkentros, meaning out of the center.",etBn:"গ্রিক ekkentros থেকে, যার অর্থ কেন্দ্রের বাইরে।",trap:{w:"Egocentric",en:"Means self-centred, not strange.",bn:"মানে আত্মকেন্দ্রিক, অদ্ভুত নয়।"},ssc:11,oth:11},
{w:"Alleviate",pos:"V.",pr:"uh-LEE-vee-ayt",prBn:"অ্যালিভিয়েট",mEn:"To reduce or ease pain, suffering, or difficulty",mBn:"ব্যথা, কষ্ট বা অসুবিধা কমানো বা লাঘব করা।",exEn:"The medicine helped alleviate her headache.",exBn:"ওষুধটি তার মাথাব্যথা কমাতে সাহায্য করল।",syn:[["Mitigate","প্রশমিত করা"],["Relieve","স্বস্তি দেওয়া"],["Diminish","কমানো"],["Reduce","হ্রাস করা"],["Mollify","শান্ত করা"],["Ameliorate","উন্নত করা"],["Lighten","হালকা করা"],["Soothe","সান্ত্বনা দেওয়া"],["Lessen","কমানো"]],ant:[["Aggravate","বাড়িয়ে তোলা"],["Intensify","তীব্র করা"],["Escalate","চড়া করা"]],useBn:"কষ্ট, ব্যথা বা সমস্যার ভার হালকা করা বোঝাতে ব্যবহার করুন।",trickBn:"AL-LEVI-ate: LEV = হালকা (light)। বোঝা বা ব্যথা হালকা করাই Alleviate।",etEn:"From Latin alleviare, from levis, meaning light.",etBn:"লাতিন alleviare থেকে, levis মানে হালকা।",trap:{w:"Elevate",en:"Looks alike, but means to raise up.",bn:"দেখতে কাছাকাছি, কিন্তু মানে উঁচুতে তোলা।"},ssc:9,oth:12},
{w:"Colossal",pos:"Adj.",pr:"kuh-LOS-uhl",prBn:"কলোসাল",mEn:"Extremely large or great",mBn:"অতি বিশাল বা অসীম বড়।",exEn:"The colossal statue could be seen from miles away.",exBn:"বিশাল মূর্তিটা মাইলের পর মাইল দূর থেকে দেখা যেত।",syn:[["Enormous","বিরাট"],["Gigantic","দৈত্যাকার"],["Immense","অপার"],["Huge","বিশাল"],["Massive","বিপুল"]],ant:[["Small","ছোট"],["Tiny","অতি ছোট"],["Teeny","ছোট্ট"],["Minimal","ন্যূনতম"],["Petite","ছোটখাটো"],["Negligible","নগণ্য"],["Short","খাটো"]],useBn:"আকারে বা মাত্রায় অত্যন্ত বড় বোঝাতে ব্যবহার করুন।",trickBn:"রোমের বিশাল স্টেডিয়াম Colosseum মনে করুন: COLOSSeum = COLOSSAL।",etEn:"From Greek kolossos, a giant statue.",etBn:"গ্রিক kolossos (বিশাল মূর্তি) থেকে।",trap:{w:"Colonial",en:"Looks alike, but relates to colonies.",bn:"দেখতে কাছাকাছি, মানে ঔপনিবেশিক।"},ssc:13,oth:8},
{w:"Dubious",pos:"Adj.",pr:"DYOO-bee-uhs",prBn:"ডিউবিয়াস",mEn:"Hesitating or doubting",mBn:"সন্দেহযুক্ত বা দ্বিধাগ্রস্ত; অবিশ্বাস্য।",exEn:"He gave a dubious reason for being late.",exBn:"দেরির জন্য সে একটা সন্দেহজনক কারণ দেখাল।",syn:[["Doubtful","সন্দেহপূর্ণ"],["Fishy","সন্দেহজনক"],["Uncertain","অনিশ্চিত"],["Unclear","অস্পষ্ট"]],ant:[["Likely","সম্ভাব্য"],["Certain","নিশ্চিত"],["Indisputable","অবিসংবাদিত"],["Incontestable","নিঃসন্দেহ"],["Trustworthy","বিশ্বাসযোগ্য"]],useBn:"যে বিষয়ে সন্দেহ বা অবিশ্বাস জাগে, তার ক্ষেত্রে ব্যবহার করুন।",trickBn:"DUBIOUS: DUB = দুই (duo)। মনে দুই ভাবনা, হ্যাঁ না, তাই সন্দেহ।",etEn:"From Latin dubius, wavering, from duo (two).",etBn:"লাতিন dubius (দোদুল্যমান) থেকে, duo মানে দুই।",trap:{w:"Doubtless",en:"Means without doubt, the opposite feel.",bn:"মানে সন্দেহাতীত, ভাবটা উল্টো।"},ssc:10,oth:11},
{w:"Spurious",pos:"Adj.",pr:"SPYOOR-ee-uhs",prBn:"স্পিউরিয়াস",mEn:"False or not what it claims to be",mBn:"নকল বা যা দাবি করে তা নয়; জাল।",exEn:"The shop was selling spurious medicines.",exBn:"দোকানটা নকল ওষুধ বিক্রি করছিল।",syn:[["Fake","নকল"],["Fraudulent","প্রতারণামূলক"],["Feigned","লোকদেখানো"]],ant:[["Authentic","প্রামাণিক"],["Genuine","আসল"]],useBn:"আসলের মতো দেখালেও যা আসল নয়, তার ক্ষেত্রে ব্যবহার করুন।",trickBn:"SPURIOUS ≈ SPY (গুপ্তচর): ছদ্মবেশে থাকে, আসল পরিচয় নয়, তাই জাল।",etEn:"From Latin spurius, illegitimate or false.",etBn:"লাতিন spurius (অবৈধ, ভুয়া) থেকে।",trap:{w:"Curious",en:"Sounds alike, but means eager to know.",bn:"শুনতে কাছাকাছি, মানে কৌতূহলী।"},ssc:11,oth:10},
{w:"Harmony",pos:"N.",pr:"HAR-muh-nee",prBn:"হারমনি",mEn:"Agreement or concord; pleasant arrangement of parts",mBn:"মিল, সামঞ্জস্য বা ঐক্য; সুসংগতি।",exEn:"The villagers live in harmony with nature.",exBn:"গ্রামবাসীরা প্রকৃতির সঙ্গে সামঞ্জস্য রেখে বাস করে।",syn:[["Consensus","সহমত"],["Peace","শান্তি"],["Unity","ঐক্য"],["Accord","সমঝোতা"]],ant:[["Strife","সংঘর্ষ"],["Conflict","বিবাদ"],["Hatred","ঘৃণা"],["Discord","কলহ"],["Incoherence","অসংগতি"]],useBn:"মিলেমিশে থাকা বা সুরের মিল বোঝাতে ব্যবহার করুন। এটি বিশেষ্য (N.)।",trickBn:"HARMONY ≈ হারমোনিয়াম: সব সুর মিলে মধুর হয়, তাই মিল।",etEn:"From Greek harmonia, joining or agreement.",etBn:"গ্রিক harmonia (জোড়া, মিল) থেকে।",trap:{w:"Harmonica",en:"A small musical instrument, not agreement.",bn:"একটি ছোট বাদ্যযন্ত্র, মিল নয়।"},ssc:13,oth:7},
{w:"Insipid",pos:"Adj.",pr:"in-SIP-id",prBn:"ইনসিপিড",mEn:"Lacking taste, flavour, or interest",mBn:"স্বাদহীন বা আগ্রহহীন; ফিকে, পানসে।",exEn:"The soup was insipid without any salt.",exBn:"লবণ ছাড়া স্যুপটা পানসে লাগছিল।",syn:[["Bland","বিস্বাদ"],["Tasteless","স্বাদহীন"],["Plain","সাদামাটা"],["Flat","ফিকে"],["Dull","নীরস"],["Prosaic","একঘেয়ে"]],ant:[["Tasty","সুস্বাদু"],["Appetizing","ক্ষুধাবর্ধক"],["Delicious","মুখরোচক"],["Piquant","ঝাল-ঝাল"],["Interesting","আকর্ষণীয়"],["Flavourful","স্বাদযুক্ত"],["Zesty","চটপটে"],["Lively","প্রাণবন্ত"]],useBn:"খাবারের স্বাদ বা কথা-কাজের আকর্ষণ না থাকলে ব্যবহার করুন।",trickBn:"IN-SIP-id: যে পানীয়তে SIP (চুমুক) দিতে ইচ্ছে করে না, তাই পানসে।",etEn:"From Latin insipidus: in (not) + sapidus (tasty).",etBn:"লাতিন insipidus: in (নয়) + sapidus (সুস্বাদু)।",trap:{w:"Incipient",en:"Looks alike, but means just beginning.",bn:"দেখতে কাছাকাছি, মানে সবে শুরু হওয়া।"},ssc:9,oth:11},
{w:"Lucid",pos:"Adj.",pr:"LOO-sid",prBn:"লুসিড",mEn:"Expressed clearly; easy to understand. Also, bright or luminous",mBn:"পরিষ্কার ও সহজবোধ্য; উজ্জ্বল, দীপ্তিময়।",exEn:"Her lucid explanation made the topic easy.",exBn:"তার স্পষ্ট ব্যাখ্যায় বিষয়টা সহজ হয়ে গেল।",syn:[["Clear","স্পষ্ট"],["Explicit","সুস্পষ্ট"]],ant:[["Vague","অস্পষ্ট"],["Dark","অন্ধকার"],["Ambiguous","দ্ব্যর্থক"],["Confusing","বিভ্রান্তিকর"],["Obscure","দুর্বোধ্য"]],useBn:"যে কথা বা লেখা পরিষ্কার বোঝা যায়, তার ক্ষেত্রে ব্যবহার করুন।",trickBn:"LUCID ≈ LUX (আলো): আলোর মতো পরিষ্কার।",etEn:"From Latin lucidus, shining, from lux (light).",etBn:"লাতিন lucidus (উজ্জ্বল) থেকে, lux মানে আলো।",trap:{w:"Lurid",en:"Looks alike, but means shocking or sensational.",bn:"দেখতে কাছাকাছি, মানে চাঞ্চল্যকর বা ভয়ংকর।"},ssc:16,oth:4},
{w:"Obstinate",pos:"Adj.",pr:"OB-sti-nuht",prBn:"অবস্টিনেট",mEn:"Refusing stubbornly to change one’s opinion or action",mBn:"নিজের মত বা কাজ বদলাতে গোঁ ধরে থাকে; জেদি।",exEn:"The obstinate child refused to eat.",exBn:"জেদি শিশুটা কিছুতেই খেতে রাজি হল না।",syn:[["Stubborn","জেদি"],["Adamant","অনড়"],["Tenacious","দৃঢ়প্রতিজ্ঞ"],["Headstrong","একগুঁয়ে"]],ant:[["Flexible","নমনীয়"],["Docile","বাধ্য"],["Obedient","আজ্ঞাবহ"],["Pliable","নরম স্বভাবের"],["Amenable","সম্মত"]],useBn:"যে কিছুতেই নিজের মত ছাড়ে না, তার ক্ষেত্রে ব্যবহার করুন।",trickBn:"OBSTINATE ≈ OBSTACLE (বাধা): নিজেই নিজের পথের বাধা, মত বদলায় না।",etEn:"From Latin obstinare, to persist.",etBn:"লাতিন obstinare (অটল থাকা) থেকে।",trap:{w:"Obstacle",en:"Related sound, but means a barrier.",bn:"শব্দে মিল, মানে বাধা।"},ssc:13,oth:7},
{w:"Vigilant",pos:"Adj.",pr:"VIJ-i-luhnt",prBn:"ভিজিল্যান্ট",mEn:"Keeping careful watch for possible danger",mBn:"বিপদের আশঙ্কায় সজাগ ও সতর্ক।",exEn:"A vigilant guard noticed the thief at once.",exBn:"সজাগ প্রহরী চোরকে সঙ্গে সঙ্গে লক্ষ করল।",syn:[["Watchful","সজাগ"],["Cautious","সতর্ক"],["Aware","সচেতন"]],ant:[["Careless","অসাবধান"],["Negligent","অবহেলাকারী"],["Rash","হঠকারী"],["Inattentive","অমনোযোগী"],["Distracted","অন্যমনস্ক"]],useBn:"পাহারা দেওয়ার মতো সজাগ থাকা বোঝাতে ব্যবহার করুন।",trickBn:"VIGIL = রাত জেগে পাহারা। যে জেগে থাকে সে-ই Vigilant।",etEn:"From Latin vigilare, to keep awake.",etBn:"লাতিন vigilare (জেগে থাকা) থেকে।",trap:{w:"Vigilante",en:"A person who takes the law into own hands.",bn:"যে নিজের হাতে আইন তুলে নেয়।"},ssc:12,oth:8},
{w:"Brave",pos:"Adj.",pr:"BRAYV",prBn:"ব্রেইভ",mEn:"Showing courage or ready to face danger",mBn:"সাহসী; বিপদের মুখোমুখি হতে প্রস্তুত।",exEn:"The brave firefighter rescued the child.",exBn:"সাহসী দমকলকর্মী শিশুটিকে উদ্ধার করলেন।",syn:[["Daring","দুঃসাহসী"],["Fearless","নির্ভীক"],["Courageous","বীর"]],ant:[["Cowardly","কাপুরুষ"],["Timid","ভীতু"],["Fearful","ভীত"]],useBn:"ভয়কে জয় করে এগিয়ে যাওয়া মানুষের ক্ষেত্রে ব্যবহার করুন।",trickBn:"BRAVE ≈ BRAVO (সাবাশ): সাহসী কাজেই সাবাশ মেলে।",etEn:"From Italian and Spanish bravo, meaning bold or wild.",etBn:"ইতালীয় ও স্প্যানিশ bravo (সাহসী) থেকে।",trap:{w:"Grave",en:"Rhymes, but means serious or a burial place.",bn:"মিল আছে, কিন্তু মানে গুরুতর বা কবর।"},ssc:15,oth:4},
{w:"Clandestine",pos:"Adj.",pr:"klan-DES-tin",prBn:"ক্ল্যানডেস্টিন",mEn:"Kept secret or done secretively",mBn:"গোপনে করা বা লুকিয়ে রাখা; গুপ্ত।",exEn:"They held a clandestine meeting at midnight.",exBn:"তারা মাঝরাতে গোপন বৈঠক করল।",syn:[["Secret","গোপনীয়"],["Covert","আড়ালের"]],ant:[["Open","খোলা"],["Overt","প্রকাশ্য"],["Known","জ্ঞাত"],["Honest","নিষ্কপট"],["Public","সর্বজনীন"],["Conspicuous","সুস্পষ্ট"],["Legal","আইনসম্মত"]],useBn:"লুকিয়ে বা অবৈধভাবে করা কাজ বোঝাতে ব্যবহার করুন।",trickBn:"CLAN-DESTINE: গোষ্ঠীর লোকেরা চুপিচুপি গন্তব্যে যায়, কেউ জানে না।",etEn:"From Latin clandestinus, from clam (secretly).",etBn:"লাতিন clandestinus থেকে, clam মানে গোপনে।",trap:{w:"Clamorous",en:"Means noisy, the opposite feel.",bn:"মানে কোলাহলপূর্ণ, ভাবটা উল্টো।"},ssc:8,oth:11},
{w:"Genuine",pos:"Adj.",pr:"JEN-yoo-in",prBn:"জেনুইন",mEn:"Truly what something is said to be; authentic",mBn:"আসল, খাঁটি; যা সত্যিই যা বলা হয় তাই।",exEn:"This is a genuine leather bag.",exBn:"এটা আসল চামড়ার ব্যাগ।",syn:[["Original","মৌলিক"],["Authentic","প্রামাণিক"],["Real","প্রকৃত"],["True","সত্য"],["Sincere","আন্তরিক"]],ant:[["Fake","নকল"],["Spurious","জাল"],["False","মিথ্যা"],["Dubious","সন্দেহজনক"],["Fictitious","কাল্পনিক"]],useBn:"আসল ও বিশুদ্ধ জিনিস বা আন্তরিক মানুষের ক্ষেত্রে ব্যবহার করুন।",trickBn:"GEN = জন্ম। জন্মগতভাবে যা আসল, সে-ই Genuine।",etEn:"From Latin genuinus, native or innate.",etBn:"লাতিন genuinus (জন্মগত) থেকে।",trap:{w:"Generous",en:"Looks alike, but means giving freely.",bn:"দেখতে কাছাকাছি, মানে দানশীল।"},ssc:13,oth:6},
{w:"Sporadic",pos:"Adj.",pr:"spuh-RAD-ik",prBn:"স্পোরাডিক",mEn:"Occurring at irregular intervals or only in a few places",mBn:"অনিয়মিত বিরতিতে বা কয়েকটি জায়গায় ঘটে এমন; ছিটেফোঁটা।",exEn:"Sporadic rain fell across the region.",exBn:"অঞ্চলটিতে ছিটেফোঁটা বৃষ্টি হল।",syn:[["Scattered","ছড়ানো-ছিটানো"],["Occasional","মাঝেমধ্যে"],["Infrequent","বিরল"],["Intermittent","বিরতিযুক্ত"]],ant:[["Systematic","সুশৃঙ্খল"],["Regular","নিয়মিত"],["Frequent","ঘন ঘন"],["Constant","অবিরাম"],["Persistent","স্থায়ী"]],useBn:"এখানে-ওখানে বা মাঝেমধ্যে ঘটে এমন বিষয়ে ব্যবহার করুন।",trickBn:"SPORADIC ≈ SPORE (বীজকণা): বীজ ছড়ালে এখানে-ওখানে গজায়, ছিটেফোঁটা।",etEn:"From Greek sporadikos, scattered, from speirein (to sow).",etBn:"গ্রিক sporadikos (ছড়ানো) থেকে, speirein মানে বীজ বোনা।",trap:{w:"Periodic",en:"Means happening at regular intervals, the opposite.",bn:"মানে নির্দিষ্ট বিরতিতে ঘটে, ঠিক উল্টো।"},ssc:7,oth:12},
{w:"Transient",pos:"Adj.",pr:"TRAN-zee-uhnt",prBn:"ট্র্যানজিয়েন্ট",mEn:"Lasting a short time",mBn:"অল্প সময় স্থায়ী; ক্ষণস্থায়ী।",exEn:"Fame is often transient.",exBn:"খ্যাতি প্রায়ই ক্ষণস্থায়ী হয়।",syn:[["Transitory","অস্থায়ী"],["Fleeting","ক্ষণিক"],["Temporary","সাময়িক"]],ant:[["Permanent","স্থায়ী"],["Lasting","দীর্ঘস্থায়ী"],["Eternal","অনন্ত"],["Perpetual","চিরস্থায়ী"]],useBn:"যা অল্প সময় থেকে চলে যায়, তার ক্ষেত্রে ব্যবহার করুন।",trickBn:"TRANS = পার হয়ে যাওয়া (transit)। পথ পেরিয়ে চলে যায়, তাই ক্ষণস্থায়ী।",etEn:"From Latin transire, to go across.",etBn:"লাতিন transire (পার হওয়া) থেকে।",trap:{w:"Transit",en:"Related, but means passage or travel.",bn:"সম্পর্কিত, কিন্তু মানে যাতায়াত বা পরিবহন।"},ssc:12,oth:7},
{w:"Affluent",pos:"Adj.",pr:"AF-loo-uhnt",prBn:"অ্যাফ্লুয়েন্ট",mEn:"Having a great deal of money; wealthy",mBn:"প্রচুর অর্থের মালিক; ধনী, সমৃদ্ধ।",exEn:"They live in an affluent neighbourhood.",exBn:"তারা ধনী পাড়ায় থাকে।",syn:[["Prosperous","সমৃদ্ধ"],["Wealthy","ধনবান"]],ant:[["Poor","গরিব"],["Destitute","নিঃস্ব"],["Deprived","বঞ্চিত"],["Impoverished","দরিদ্র"]],useBn:"টাকাপয়সায় ভরপুর মানুষ বা এলাকা বোঝাতে ব্যবহার করুন।",trickBn:"AFFLUENT ≈ FLOW (প্রবাহ): অর্থ নদীর মতো বয়ে আসে যার ঘরে।",etEn:"From Latin affluere, to flow toward.",etBn:"লাতিন affluere (দিকে প্রবাহিত হওয়া) থেকে।",trap:{w:"Effluent",en:"Sounds alike, but means liquid waste.",bn:"শুনতে কাছাকাছি, মানে তরল বর্জ্য।"},ssc:11,oth:7},
{w:"Bleak",pos:"Adj.",pr:"BLEEK",prBn:"ব্লিক",mEn:"Cold, empty, or without hope",mBn:"ঠান্ডা, ফাঁকা বা আশাহীন; উদাস, নিরাশাজনক।",exEn:"The bleak winter landscape had no sign of life.",exBn:"শীতের নিরাশাজনক প্রান্তরে প্রাণের কোনো চিহ্ন ছিল না।",syn:[["Depressing","নিরাশাজনক"],["Grim","ভয়ানক"],["Gloomy","উদাস"],["Dreary","নীরস ★"],["Hopeless","আশাহীন ★"]],ant:[["Bright","প্রফুল্ল"],["Cheerful","আনন্দিত"],["Cordial","সৌহার্দ্যপূর্ণ"],["Verdant","হরা-ভরা"],["Lush","ঘন সবুজ"],["Hopeful","আশাবাদী ★"],["Promising","সম্ভাবনাময় ★"]],useBn:"ফাঁকা, ঠান্ডা বা আশাহীন পরিবেশ বা পরিস্থিতি বোঝাতে ব্যবহার করুন।",trickBn:"BLEAK ≈ BLEACH (ব্লিচ): ব্লিচে রং উঠে সব ফ্যাকাশে ও ফাঁকা হয়ে যায়, তাই আশাহীন।",etEn:"From Old Norse bleikr, meaning pale.",etBn:"পুরোনো নর্স bleikr (ফ্যাকাশে) থেকে।",trap:{w:"Bleach",en:"Looks alike, but it is a whitening chemical.",bn:"দেখতে কাছাকাছি, কিন্তু মানে রং ওঠানোর রাসায়নিক।"},ssc:10,oth:8},
{w:"Callous",pos:"Adj.",pr:"KAL-uhs",prBn:"ক্যালাস",mEn:"Showing no sympathy or cruel disregard for others",mBn:"অন্যের প্রতি সহানুভূতি নেই বা নির্মমভাবে অবহেলা করে এমন; কঠোর।",exEn:"He was callous to the suffering of the poor.",exBn:"সে গরিবের কষ্টের প্রতি নির্মম উদাসীন ছিল।",syn:[["Brutal","নির্দয়"],["Insensitive","সংবেদনহীন"],["Cruel","নিষ্ঠুর"],["Unfeeling","অসংবেদনশীল"],["Heartless","হৃদয়হীন ★"]],ant:[["Sensitive","সংবেদনশীল"],["Sympathetic","সহানুভূতিশীল"],["Merciful","দয়ালু"],["Tender","কোমল"],["Caring","যত্নশীল"],["Concerned","উদ্বিগ্ন, মনোযোগী"],["Kind","সদয়"],["Considerate","বিবেচক"],["Humane","মানবিক ★"]],useBn:"যার মনে অন্যের কষ্টের জন্য দয়া বা অনুভূতি নেই, তার জন্য ব্যবহার করুন।",trickBn:"CALLOUS ≈ CALLUS (কড়া): হাতে কড়া পড়লে ব্যথা টের পাওয়া যায় না, মনে কড়া পড়লে অন্যের কষ্টও টের পায় না।",etEn:"From Latin callosus, thick-skinned, from callus (hard skin).",etBn:"লাতিন callosus (পুরু চামড়ার) থেকে, callus মানে শক্ত চামড়া।",trap:{w:"Callus",en:"Related, but means a hard patch of skin.",bn:"সম্পর্কিত, কিন্তু মানে চামড়ার শক্ত কড়া।"},ssc:13,oth:5},
{w:"Coarse",pos:"Adj.",pr:"KORS",prBn:"কর্স",mEn:"Rough or loose in texture or grain; vulgar or crude in speech or manner",mBn:"গঠনে খসখসে বা মোটা; কথা বা আচরণে অমার্জিত, অসভ্য।",exEn:"The coarse cloth hurt his skin.",exBn:"খসখসে কাপড়টা তার ত্বকে লাগছিল।",syn:[["Rough","রুক্ষ"],["Crude","অমার্জিত"],["Scratchy","খসখসে"],["Vulgar","অশ্লীল ★"],["Uncouth","অসভ্য ★"]],ant:[["Smooth","মসৃণ"],["Gentle","কোমল"],["Refined","পরিশীলিত"],["Buttery","মাখনের মতো"],["Soft","নরম"],["Delicate","নাজুক"],["Fine","মিহি"],["Chaste","শালীন"],["Polite","ভদ্র ★"]],useBn:"খসখসে জিনিস বা অমার্জিত কথাবার্তা ও আচরণ বোঝাতে ব্যবহার করুন।",trickBn:"COARSE শব্দের ভেতরে OAR (দাঁড়) আছে। দাঁড়ের হাতল খসখসে, তাই Coarse = খসখসে।",etEn:"From Middle English cors, originally meaning ordinary or common.",etBn:"মধ্য ইংরেজি cors থেকে, আদিতে অর্থ ছিল সাধারণ।",trap:{w:"Course",en:"Sounds the same, but means a path or a study programme.",bn:"উচ্চারণ একই, কিন্তু মানে পথ বা পাঠ্যক্রম।"},ssc:9,oth:9},
{w:"Dismal",pos:"Adj.",pr:"DIZ-muhl",prBn:"ডিজমাল",mEn:"Very depressing or gloomy; extremely poor in quality",mBn:"অত্যন্ত বিষণ্ণ বা নিরাশাজনক; অতি নিম্নমানের।",exEn:"The team gave a dismal performance.",exBn:"দলটা অত্যন্ত খারাপ খেলা দেখাল।",syn:[["Gloomy","উদাস"],["Dejected","নিরাশ"],["Dreary","নীরস"],["Bleak","নিরাশাজনক"],["Miserable","শোচনীয় ★"],["Sombre","বিষণ্ণ ★"]],ant:[["Cheerful","প্রসন্ন"],["Lively","প্রাণবন্ত"],["Luminous","উজ্জ্বল"],["Bright","উজ্জ্বল"],["Pleasant","সুখদ"],["Cordial","গরমজোশী"],["Cheery","হর্ষিত"],["Animated","সজীব"],["Positive","ইতিবাচক"],["Joyful","আনন্দময় ★"]],useBn:"বিষণ্ণ পরিবেশ বা অত্যন্ত খারাপ মানের কিছু বোঝাতে ব্যবহার করুন।",trickBn:"DIS-MAL: DIS = দিন (dies), MAL = খারাপ। খারাপ দিন, তাই বিষণ্ণ ও নিম্নমানের।",etEn:"From Medieval Latin dies mali, meaning evil days.",etBn:"মধ্যযুগীয় লাতিন dies mali (অশুভ দিন) থেকে।",trap:{w:"Dismay",en:"Looks alike, but means sudden worry or shock.",bn:"দেখতে কাছাকাছি, কিন্তু মানে আকস্মিক দুশ্চিন্তা বা আঘাত।"},ssc:9,oth:9},
{w:"Ephemeral",pos:"Adj.",pr:"ih-FEM-er-uhl",prBn:"ইফেমারাল",mEn:"Lasting for a very short time",mBn:"খুব অল্প সময় স্থায়ী; ক্ষণস্থায়ী, অল্পকালীন।",exEn:"The beauty of a rainbow is ephemeral.",exBn:"রামধনুর সৌন্দর্য ক্ষণস্থায়ী।",syn:[["Transient","ক্ষণিক"],["Fleeting","পলক-ভরের"],["Short-lived","অল্পকালীন"],["Transitory","অস্থায়ী"],["Brief","সংক্ষিপ্ত"],["Momentary","মুহূর্তের ★"]],ant:[["Eternal","অনন্ত"],["Permanent","স্থায়ী"],["Enduring","টেকসই"],["Long-Lasting","দীর্ঘকালীন"],["Everlasting","চিরন্তন ★"]],useBn:"যা এক দিন বা অল্প সময়েই শেষ হয়ে যায়, তার জন্য ব্যবহার করুন।",trickBn:"EPHEMERAL-এর HEMERA = দিন (গ্রিক)। এক দিনের জন্য টিকে থাকে যা, সে-ই Ephemeral।",etEn:"From Greek ephemeros, lasting only a day.",etBn:"গ্রিক ephemeros (এক দিনের) থেকে, hemera মানে দিন।",trap:{w:"Ethereal",en:"Looks alike, but means light, airy, heavenly.",bn:"দেখতে কাছাকাছি, কিন্তু মানে হালকা, অপার্থিব।"},ssc:8,oth:10},
{w:"Frugal",pos:"Adj.",pr:"FROO-guhl",prBn:"ফ্রুগাল",mEn:"Economical with money or food",mBn:"টাকা বা খাবারে মিতব্যয়ী; অপচয় করে না।",exEn:"He lived a frugal life and saved every rupee.",exBn:"সে মিতব্যয়ী জীবন কাটাত এবং প্রতিটি টাকা বাঁচাত।",syn:[["Economical","মিতব্যয়ী"],["Thrifty","সঞ্চয়ী"],["Sparing","সংযমী ★"]],ant:[["Wasteful","অপচয়কারী"],["Spendthrift","অমিতব্যয়ী"],["Prodigal","অপব্যয়ী"],["Profligate","উড়নচণ্ডী"],["Extravagant","বাড়াবাড়ি খরচকারী"],["Lavish","অঢেল খরচের ★"],["Improvident","অদূরদর্শী ★"]],useBn:"অযথা খরচ না করে সঞ্চয় করা মানুষ বোঝাতে ব্যবহার করুন। এটা কৃপণতা নয়, বুদ্ধিমান মিতব্যয়।",trickBn:"FRUGAL ≈ FRUIT (ফল): ফলের মতো সামান্য খাবারে যে দিন চালায়, সে মিতব্যয়ী।",etEn:"From Latin frugalis, from frux (fruit, produce).",etBn:"লাতিন frugalis থেকে, frux মানে ফল বা ফসল।",trap:{w:"Fragile",en:"Looks alike, but means easily broken.",bn:"দেখতে কাছাকাছি, কিন্তু মানে সহজে ভেঙে যায় এমন।"},ssc:13,oth:5},
{w:"Morose",pos:"Adj.",pr:"muh-ROHS",prBn:"মরোস",mEn:"Very sad, quiet, and unwilling to talk to others",mBn:"অত্যন্ত বিষণ্ণ, চুপচাপ ও অন্যের সঙ্গে কথা বলতে নারাজ।",exEn:"He sat in morose silence after the defeat.",exBn:"হারের পর সে বিষণ্ণ নীরবতায় বসে রইল।",syn:[["Gloomy","উদাস"],["Sullen","মুখ ভার করা"],["Mournful","শোকপূর্ণ"],["Ill-Tempered","বদমেজাজি"],["Glum","মিমর্ষ ★"]],ant:[["Cheerful","খুশ"],["Jovial","হাসিখুশি"],["Uplifted","উৎসাহিত"],["Merry","আনন্দময় ★"]],useBn:"যে বিষণ্ণ হয়ে চুপচাপ থাকে ও কারও সঙ্গে মিশতে চায় না, তার জন্য ব্যবহার করুন।",trickBn:"MOROSE ≈ মরা-মরা: মুখটা মরা-মরা, চুপচাপ বিষণ্ণ।",etEn:"From Latin morosus, peevish, from mos (manner or habit).",etBn:"লাতিন morosus (খিটখিটে) থেকে, mos মানে স্বভাব।",trap:{w:"Moral",en:"Looks alike, but relates to right and wrong.",bn:"দেখতে কাছাকাছি, কিন্তু মানে নৈতিক।"},ssc:11,oth:7},
{w:"Obscure",pos:"Adj.",pr:"ob-SKYOOR",prBn:"অবস্কিউর",mEn:"Unclear or not well known",mBn:"অস্পষ্ট বা বেশি পরিচিত নয়; দুর্বোধ্য।",exEn:"The meaning of the old poem is obscure.",exBn:"পুরোনো কবিতার অর্থ অস্পষ্ট।",syn:[["Confusing","বিভ্রান্তিকর"],["Unknown","অজানা"],["Vague","অস্পষ্ট ★"],["Unclear","অস্পষ্ট ★"]],ant:[["Clear","স্পষ্ট"],["Prominent","প্রমুখ"],["Famous","প্রসিদ্ধ"],["Distinct","সুস্পষ্ট ★"]],useBn:"যা পরিষ্কার বোঝা যায় না বা যার নামডাক নেই, তার জন্য ব্যবহার করুন।",trickBn:"OB-SCURE: OB = ওপরে ঢাকা, SCURE ≈ SCREEN (পর্দা)। পর্দায় ঢাকা, তাই অস্পষ্ট।",etEn:"From Latin obscurus, covered over or dark.",etBn:"লাতিন obscurus (ঢাকা, অন্ধকার) থেকে।",trap:{w:"Obscene",en:"Sounds alike, but means indecent.",bn:"শুনতে কাছাকাছি, মানে অশ্লীল।"},ssc:"–",oth:"–"},
{w:"Reluctant",pos:"Adj.",pr:"ri-LUK-tuhnt",prBn:"রিলাক্ট্যান্ট",mEn:"Not willing or eager; hesitant to act",mBn:"ইচ্ছুক নয় বা কাজ করতে দ্বিধাগ্রস্ত; অনিচ্ছুক।",exEn:"She was reluctant to speak in front of the crowd.",exBn:"সে ভিড়ের সামনে কথা বলতে অনিচ্ছুক ছিল।",syn:[["Hesitant","হিচকিচানো"],["Unwilling","অনিচ্ছুক"],["Averse","বিরুদ্ধ"],["Disinclined","অনিচ্ছুক"],["Loath","অনিচ্ছুক ★"]],ant:[["Eager","উৎসুক"],["Willing","ইচ্ছুক"],["Inclined","প্রবণ"],["Enthusiastic","উৎসাহী"],["Keen","আগ্রহী ★"]],useBn:"কাজ করতে মন না চাইলে বা দ্বিধা থাকলে ব্যবহার করুন।",trickBn:"RE-LUCT-ant: LUCT = লড়াই (luctari)। ভেতরে লড়াই চলছে, করতে চায় না।",etEn:"From Latin reluctari, to struggle against.",etBn:"লাতিন reluctari (বিরুদ্ধে লড়াই করা) থেকে।",trap:{w:"Reliant",en:"Looks alike, but means dependent.",bn:"দেখতে কাছাকাছি, মানে নির্ভরশীল।"},ssc:11,oth:7},
{w:"Taciturn",pos:"Adj.",pr:"TAS-i-turn",prBn:"ট্যাসিটার্ন",mEn:"Reserved in speech; saying very little",mBn:"কথায় সংযত; খুব কম কথা বলে; অল্পভাষী।",exEn:"The taciturn old man rarely spoke to anyone.",exBn:"অল্পভাষী বৃদ্ধ লোকটি প্রায় কারও সঙ্গে কথা বলতেন না।",syn:[["Silent","নীরব"],["Reticent","সংকোচী"],["Uncommunicative","কথা না বলা"],["Unresponsive","প্রতিক্রিয়াহীন"],["Quiet","চুপচাপ ★"]],ant:[["Talkative","বাকপটু"],["Loquacious","বাচাল"],["Garrulous","বাতুনে"],["Chatty","গল্পপ্রিয় ★"]],useBn:"যে মানুষ খুব কম কথা বলে, তার ক্ষেত্রে ব্যবহার করুন।",trickBn:"TACITURN ≈ TACIT (নীরব) + TURN: কথার সময় মুখ ঘুরিয়ে নীরব থাকে।",etEn:"From Latin tacere, to be silent.",etBn:"লাতিন tacere (নীরব থাকা) থেকে।",trap:{w:"Tacit",en:"Related, but means understood without being said.",bn:"সম্পর্কিত, কিন্তু মানে বলা ছাড়াই বোঝা যায়।"},ssc:10,oth:8},
{w:"Abolish",pos:"V.",pr:"uh-BOL-ish",prBn:"অ্যাবলিশ",mEn:"To formally put an end to something",mBn:"আনুষ্ঠানিকভাবে কোনো কিছুর অবসান ঘটানো; বাতিল করা।",exEn:"The government decided to abolish the old law.",exBn:"সরকার পুরোনো আইনটি বাতিল করার সিদ্ধান্ত নিল।",syn:[["Eliminate","সরিয়ে ফেলা"],["Cancel","বাতিল করা"],["Eradicate","উৎপাটন করা"],["Destroy","ধ্বংস করা"],["Annul","রদ করা ★"]],ant:[["Build","গড়া"],["Construct","নির্মাণ করা"],["Establish","প্রতিষ্ঠা করা"],["Continue","চালিয়ে যাওয়া"],["Create","সৃষ্টি করা"],["Restore","পুনর্স্থাপন করা"],["Introduce","চালু করা ★"]],useBn:"আইন, প্রথা বা ব্যবস্থা সারাবার জন্য বাতিল করা বোঝাতে ব্যবহার করুন।",trickBn:"অ্যাবলিশ ≈ আর বলিস না: আর বলিস না, সব বাতিল করে দিলাম!",etEn:"From Latin abolere, to destroy.",etBn:"লাতিন abolere (ধ্বংস করা) থেকে।",trap:{w:"Demolish",en:"Similar sense, but means to pull down a building.",bn:"বোঝার ভাব কাছাকাছি, কিন্তু মানে বাড়ি ভেঙে ফেলা।"},ssc:12,oth:"–"},
{w:"Authentic",pos:"Adj.",pr:"aw-THEN-tik",prBn:"অথেন্টিক",mEn:"Genuine; real; true in origin; not fake or copied",mBn:"আসল, বিশ্বসনীয়; উৎসে সত্য, নকল বা অনুকরণ নয়।",exEn:"The museum displays authentic ancient coins.",exBn:"জাদুঘরে আসল প্রাচীন মুদ্রা প্রদর্শিত হয়।",syn:[["Genuine","আসল"],["Real","প্রকৃত ★"],["Original","মৌলিক ★"]],ant:[["False","মিথ্যা"],["Fake","নকল"],["Spurious","জাল"],["Falsified","জাল করা"],["Counterfeit","কাল্পনিক নকল ★"]],useBn:"যা আসল, নকল নয় এবং বিশ্বসযোগ্য উৎস থেকে এসেছে, তার জন্য ব্যবহার করুন।",trickBn:"AUTHENTIC ≈ AUTHOR (লেখক, স্রষ্টা): স্রষ্টার নিজের হাতের তৈরি, তাই আসল।",etEn:"From Greek authentikos, original or genuine.",etBn:"গ্রিক authentikos (মূল, আসল) থেকে।",trap:{w:"Authority",en:"Related sound, but means power or an expert.",bn:"শব্দে মিল, মানে কর্তৃপক্ষ বা বিশেষজ্ঞ।"},ssc:9,oth:8},
{w:"Conceal",pos:"V.",pr:"kuhn-SEEL",prBn:"কনসিল",mEn:"To keep something hidden from sight",mBn:"কিছু দৃষ্টির আড়ালে রাখা; লুকানো।",exEn:"He tried to conceal the letter under the pillow.",exBn:"সে চিঠিটা বালিশের নিচে লুকিয়ে রাখতে চেষ্টা করল।",syn:[["Hide","লুকানো"],["Disguise","ছদ্মবেশ ধারণ"],["Cover","ঢেকে রাখা ★"],["Mask","মুখোশ পরানো ★"]],ant:[["Reveal","প্রকাশ করা"],["Unwrap","খুলে ফেলা"],["Illuminate","উদ্ভাসিত করা"],["Expose","উন্মোচন করা ★"],["Disclose","ফাঁস করা ★"]],useBn:"কোনো তথ্য বা জিনিস ইচ্ছাকৃতভাবে লুকিয়ে রাখা বোঝাতে ব্যবহার করুন।",trickBn:"CON-CEAL ≈ CON + SEAL (সিল): সিল করে লুকিয়ে রাখা।",etEn:"From Latin concelare: con (together) + celare (to hide).",etBn:"লাতিন concelare: con (সম্পূর্ণ) + celare (লুকানো) থেকে।",trap:{w:"Congeal",en:"Sounds alike, but means to become solid, like blood.",bn:"শুনতে কাছাকাছি, মানে জমাট বাঁধা।"},ssc:9,oth:8},
{w:"Gloomy",pos:"Adj.",pr:"GLOO-mee",prBn:"গ্লুমি",mEn:"Dark or poorly lit, appearing depressing or sad",mBn:"অন্ধকার বা কম আলোয় ঢাকা; বিষণ্ণ, উদাস।",exEn:"The gloomy room made everyone feel sad.",exBn:"অন্ধকার ঘরটা সবাইকে বিষণ্ণ করে তুলল।",syn:[["Dismal","বিষণ্ণ ★"],["Dreary","নীরস ★"],["Sombre","বিষণ্ণ ★"],["Dejected","নিরাশ ★"]],ant:[["Cheerful","খুশ ★"],["Bright","উজ্জ্বল ★"],["Lively","প্রাণবন্ত ★"],["Jovial","হাসিখুশি ★"]],useBn:"অন্ধকার বা বিষণ্ণ পরিবেশ বা মনের অবস্থা বোঝাতে ব্যবহার করুন।",trickBn:"GLOOMY ≈ গুমোট: গুমোট আবহাওয়ার মতো অন্ধকার ও বিষণ্ণ।",etEn:"From Middle English gloumen, to look sullen; older origin uncertain.",etBn:"মধ্য ইংরেজি gloumen (মুখ ভার করা) থেকে; আরও আগের উৎস অনিশ্চিত।",trap:{w:"Glowing",en:"Looks alike, but means shining brightly.",bn:"দেখতে কাছাকাছি, কিন্তু মানে উজ্জ্বলভাবে জ্বলতে থাকা।"},ssc:13,oth:4},
{w:"Judicious",pos:"Adj.",pr:"joo-DISH-uhs",prBn:"জুডিশাস",mEn:"Having, showing, or done with good judgment or sense",mBn:"সুবিবেচনাপূর্ণ; বিচক্ষণভাবে করা।",exEn:"She made a judicious choice of words.",exBn:"সে সুবিবেচনার সঙ্গে শব্দ বেছে নিল।",syn:[["Wise","বুদ্ধিমান"],["Cautious","সতর্ক"],["Prudent","বিচক্ষণ"],["Sensible","সমঝদার"],["Thoughtful","বিবেচক"],["Reasonable","যুক্তিসংগত"]],ant:[["Rash","হঠকারী"],["Unwise","অবিবেচক"],["Indiscreet","অসংযত, অবিবেকী"]],useBn:"বিচার-বিবেচনা করে সিদ্ধান্ত নেওয়ার ব্যাপারে ব্যবহার করুন।",trickBn:"JUDICIOUS ≈ JUDGE (বিচারক): জজের মতো বিচার-বিবেচনা করে কাজ করা।",etEn:"From Latin judicium, meaning judgment.",etBn:"লাতিন judicium (রায়, বিচার) থেকে।",trap:{w:"Judicial",en:"Related, but means of courts and judges.",bn:"সম্পর্কিত, কিন্তু মানে আদালত বা বিচারবিভাগীয়।"},ssc:13,oth:4},
{w:"Modest",pos:"Adj.",pr:"MOD-ist",prBn:"মডেস্ট",mEn:"Unassuming in estimation of one’s abilities",mBn:"নিজের ক্ষমতা নিয়ে অহংকারহীন; বিনয়ী।",exEn:"Though famous, he remained modest.",exBn:"খ্যাতি পেলেও সে বিনয়ী থেকে গেল।",syn:[["Humble","বিনয়ী"],["Shy","লাজুক"],["Demure","সলজ্জ"]],ant:[["Vain","অহংকারী"],["Conceited","দাম্ভিক"],["Arrogant","উদ্ধত"],["Immodest","অশিষ্ট"],["Luxurious","বিলাসবহুল"]],useBn:"যে মানুষ নিজের গুণ নিয়ে বড়াই করে না, তার ক্ষেত্রে ব্যবহার করুন।",trickBn:"MODEST ≈ MODE (মাপ): নিজের মাপে থাকে, বাড়াবাড়ি করে না।",etEn:"From Latin modestus, keeping due measure, from modus.",etBn:"লাতিন modestus (সীমার মধ্যে) থেকে, modus মানে মাপ।",trap:{w:"Moderate",en:"Related, but means average or not extreme.",bn:"সম্পর্কিত, কিন্তু মানে মাঝারি বা পরিমিত।"},ssc:9,oth:8},
{w:"Perilous",pos:"Adj.",pr:"PER-uh-luhs",prBn:"পেরিলাস",mEn:"Full of danger or risk",mBn:"বিপদে ভরা বা ঝুঁকিপূর্ণ; বিপজ্জনক।",exEn:"They made a perilous journey across the mountain.",exBn:"তারা পাহাড় পেরিয়ে একটি বিপজ্জনক যাত্রা করল।",syn:[["Hazardous","ঝুঁকিপূর্ণ"],["Dangerous","বিপজ্জনক"],["Risky","ঝুঁকিবহুল"]],ant:[["Safe","নিরাপদ"]],useBn:"বিপদ বা ঝুঁকির ভরপুর পরিস্থিতি বোঝাতে ব্যবহার করুন। এর একমাত্র Antonym Safe।",trickBn:"PERIL = বিপদ। PERIL + OUS (পূর্ণ) = বিপদে পূর্ণ।",etEn:"From Latin periculum, meaning danger.",etBn:"লাতিন periculum (বিপদ) থেকে।",trap:{w:"Perish",en:"Related, but means to die or be destroyed.",bn:"সম্পর্কিত, কিন্তু মানে মারা যাওয়া বা ধ্বংস হওয়া।"},ssc:13,oth:4},
{w:"Prudent",pos:"Adj.",pr:"PROOD-nt",prBn:"প্রুডেন্ট",mEn:"Showing careful judgment and planning for the future",mBn:"ভবিষ্যতের কথা ভেবে সতর্ক ও বিচক্ষণ; বিবেকী।",exEn:"It is prudent to save money for emergencies.",exBn:"জরুরি প্রয়োজনের জন্য টাকা বাঁচানো বিচক্ষণতা।",syn:[["Cautious","সাবধান"],["Wise","বুদ্ধিমান"],["Frugal","অল্পব্যয়ী"],["Judicious","বিবেকপূর্ণ"],["Careful","সাবধান"]],ant:[["Unwise","অবিবেকী"],["Careless","অসাবধান"],["Indiscreet","অসাবধান, অবিবেকী"],["Stupid","বোকা"],["Thoughtless","অবিবেচক"],["Wasteful","অপব্যয়ী"]],useBn:"আগাম ভেবে সাবধানে পদক্ষেপ নেয় এমন মানুষের ক্ষেত্রে ব্যবহার করুন।",trickBn:"PRUDENT ≈ PROVIDENT: আগাম দেখে প্রস্তুত থাকে, তাই বিচক্ষণ।",etEn:"From Latin prudens, a short form of providens, meaning foreseeing.",etBn:"লাতিন prudens (providens-এর সংক্ষিপ্ত রূপ) থেকে, যার অর্থ আগাম দেখা।",trap:{w:"Prudish",en:"Looks alike, but means easily shocked by rude things.",bn:"দেখতে কাছাকাছি, কিন্তু মানে নীতিবাগিশ।"},ssc:15,oth:2},
{w:"Transparent",pos:"Adj.",pr:"trans-PAIR-uhnt",prBn:"ট্র্যানস্প্যারেন্ট",mEn:"Easy to see through; clear or open",mBn:"যার ভেতর দিয়ে দেখা যায়; স্বচ্ছ, খোলামেলা।",exEn:"The company kept its accounts transparent.",exBn:"সংস্থাটি তার হিসাব স্বচ্ছ রেখেছিল।",syn:[["Lucid","স্পষ্ট"],["Clear","পরিষ্কার"],["Open","খোলামেলা ★"]],ant:[["Opaque","অস্বচ্ছ"]],useBn:"কাচের মতো স্বচ্ছ কিংবা লুকোছাপাহীন কাজের ক্ষেত্রে ব্যবহার করুন।",trickBn:"TRANS = ভেতর দিয়ে + PARENT ≈ APPEAR (দেখা যাওয়া)। ভেতর দিয়ে দেখা যায়, তাই স্বচ্ছ।",etEn:"From Latin transparere, to show through.",etBn:"লাতিন transparere (ভেতর দিয়ে দেখা যাওয়া) থেকে।",trap:{w:"Translucent",en:"Lets light through, but you cannot see clearly.",bn:"আলো যায়, কিন্তু পরিষ্কার দেখা যায় না।"},ssc:10,oth:7},
{w:"Admonish",pos:"V.",pr:"ad-MON-ish",prBn:"অ্যাডমনিশ",mEn:"To warn or scold someone firmly",mBn:"কাউকে দৃঢ়ভাবে সতর্ক করা বা তিরস্কার করা; ভর্ৎসনা করা।",exEn:"The teacher admonished the boy for being late.",exBn:"দেরি করার জন্য শিক্ষক ছেলেটিকে ভর্ৎসনা করলেন।",syn:[["Chide","ভর্ৎসনা করা"],["Reprimand","তিরস্কার করা"],["Warn","সতর্ক করা"],["Counsel","পরামর্শ দেওয়া"],["Censure","নিন্দা করা"]],ant:[["Praise","প্রশংসা করা"],["Applaud","করতালি দেওয়া"],["Compliment","তারিফ করা"]],useBn:"দৃঢ়ভাবে সতর্ক করা বা বকানো বোঝাতে ব্যবহার করুন। এটি ক্রিয়া (V.)।",trickBn:"AD + MON ≈ MONITOR (সতর্ক করা): ভুল ধরিয়ে দিয়ে সতর্কবার্তা দেওয়া।",etEn:"From Latin admonere, to remind or warn.",etBn:"লাতিন admonere (মনে করিয়ে দেওয়া, সতর্ক করা) থেকে।",trap:{w:"Admission",en:"Looks alike, but means entry or a confession.",bn:"দেখতে কাছাকাছি, কিন্তু মানে ভর্তি বা স্বীকারোক্তি।"},ssc:9,oth:7},

function card(x,i){
 const pills=(a,c)=>a.map(p=>`<div class="pill ${c}"><span>${p[0]}<small class="bp">${PB[p[0]]||""}</small></span><i data-l="bn">${p[1]}</i></div>`).join("");
 return `<div class="card" data-k="${x.w.toLowerCase()}"><div class="hd"><div><h2 class="w">${x.w}<span class="pos">${x.pos}</span></h2>
 <div class="pr">${x.pr} <b>${x.prBn}</b></div></div><span class="no">#${i+1}</span></div>
 <p class="m"><span data-l="en">${x.mEn}</span><span data-l="bn" class="bn">${x.mBn}</span></p>
 <div class="tags"><span class="tag ssc">SSC ${x.ssc}</span><span class="tag">Others ${x.oth}</span></div>
 <div class="body">
  <div class="box ex"><h4>Example</h4><span data-l="en">${x.exEn}</span><div data-l="bn">${x.exBn}</div></div>
  <div class="box sa"><h4>Synonyms / Antonyms</h4><div class="lab s">SYNONYMS</div>${pills(x.syn,"s")}<div class="lab a">ANTONYMS</div>${pills(x.ant,"a")}</div>
  <div class="box sa"><h4>Usage</h4>${x.useBn}</div>
  <div class="box tr"><h4>Trick</h4>${x.trickBn}</div>
  <div class="box et"><h4>Etymology</h4><span data-l="en">${x.etEn}</span><span data-l="bn">${x.etBn}</span></div>
  <div class="box tp"><h4>Trap Confusers</h4><b>${x.trap.w}</b><small class="bp">${PB[x.trap.w]||""}</small><span class="sound">Sound Alike</span><div><span data-l="en">${x.trap.en}</span><span data-l="bn">${x.trap.bn}</span></div></div>
 </div></div>`}
function render(){
 const t=$("#q").value.trim().toLowerCase();
 const h=WORDS.map((x,i)=>({x,i})).filter(o=>!t||o.x.w.toLowerCase().includes(t)).map(o=>card(o.x,o.i)).join("");
 $("#list").innerHTML=h||'<div class="empty">No word found</div>';
 $("#count").textContent=WORDS.length+" words saved · "+WORDS.length+" শব্দ";
 document.querySelectorAll(".hd").forEach(e=>e.onclick=()=>e.parentElement.classList.toggle("open"));
}
$("#q").oninput=render;
$("#tg").onclick=e=>{const m=e.target.dataset.m;if(!m)return;document.body.className=m;document.querySelectorAll("#tg button").forEach(b=>b.classList.toggle("on",b.dataset.m===m))};
render();
</script>
