base.forEach((d,i)=>{const x=X[i];d.pron=x[0];d.sim=x[1];d.opp=x[2];d.use=x[3];d.nouse=x[4];d.trick=x[5];d.origin=x[6]});
let data=base,cur=null,q="",ch="all";
try{const s=localStorage.getItem("idm");if(s)data=JSON.parse(s)}catch(e){}
data.forEach((d,i)=>{if(base[i]&&d.idiom===base[i].idiom&&!d.trick)Object.assign(d,base[i],{ssc:d.ssc,others:d.others})});
const sp=(s,c,l)=>{if(!s)return"";const[a,b]=s.split("|");return `<div class="chip ${c}"><i>${l}</i>${esc(a)}${b?" ("+esc(b)+")":""}</div>`};
const ex=d=>`<div class="sec" style="background:var(--ex)"><b>EXAMPLE</b>${esc(d.example)}</div>`+((d.sim||d.opp)?`<div class="sec" style="background:var(--sim)"><b>SIMILAR IDIOMS</b>${sp(d.sim,"cs","SIM")}${sp(d.opp,"co","OPP")}</div>`:"")+(d.use?`<div class="sec" style="background:var(--box)"><b>USAGE</b>${esc(d.use)}<div class="nu">কখন ব্যবহার করবে না</div>${esc(d.nouse)}</div>`:"")+(d.trick?`<div class="sec" style="background:var(--sim)"><b>TRICK</b>${esc(d.trick)}</div>`:"")+(d.origin?`<div class="sec" style="background:#ead9f7;color:#222"><b style="color:#6b3fa0">ORIGIN</b>${esc(d.origin)}</div>`:"");
const save=()=>{try{localStorage.setItem("idm",JSON.stringify(data))}catch(e){}};
const esc=s=>String(s??"").replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]));
function render(){const A=document.getElementById("app");
if(cur!==null){const d=data[cur];A.innerHTML=`<header><button class="btn" onclick="cur=null;render()">←</button><div><h1>Idiom · ${Math.floor(cur/25)+1}.${0}</h1><small>#${cur+1}/${data.length}</small></div></header>
<div class="c" style="cursor:default"><span class="n">SSC ${d.ssc||0} · Others ${d.others||0}</span><p class="big">${esc(d.idiom)}</p>${d.pron?`<p class="pr">🔊 ${esc(d.pron)}</p>`:""}<p>${esc(d.meaning)}</p><p class="bn">${esc(d.bn)}</p></div>
${ex(d)}
<div class="row"><button class="btn" onclick="go(-1)">‹ Prev</button><small>${cur+1} / ${data.length}</small><button class="btn g" onclick="go(1)">Next ›</button></div>`;scrollTo(0,0);return}
const chs=Math.ceil(data.length/25);
let opts='<option value="all">সব chapter</option>';for(let i=0;i<chs;i++)opts+=`<option value="${i}" ${ch==i?"selected":""}>Chapter 1.${i+1} · ${i*25+1}–${Math.min(data.length,i*25+25)}</option>`;
const L=data.map((d,i)=>[d,i]).filter(([d,i])=>(ch==="all"||Math.floor(i/25)==ch)&&(d.idiom+d.meaning+d.bn).toLowerCase().includes(q.toLowerCase()));
A.innerHTML=`<header><div class="logo">B</div><div style="flex:1"><h1>Idioms / Phrases</h1><small>${data.length} idioms · Top Idioms</small></div><button class="btn" onclick="dlg.showModal()">＋</button></header>
<div class="bar"><input id="q" placeholder="🔍 Search..." value="${esc(q)}" oninput="q=this.value;render();document.getElementById('q').focus()"><select onchange="ch=this.value;render()">${opts}</select></div>`+
L.map(([d,i])=>`<div class="c" onclick="cur=${i};render()"><span class="n">#${i+1}</span><h2>${esc(d.idiom)}</h2>${d.pron?`<p class="pr">🔊 ${esc(d.pron)}</p>`:""}<p>${esc(d.meaning)}</p><p class="bn">${esc(d.bn)}</p><span class="tag t1">SSC ${d.ssc||0}</span><span class="tag">Others ${d.others||0}</span></div>`).join("")||"<p>কিছু পাওয়া যায়নি।</p>";}
function go(n){cur=Math.max(0,Math.min(data.length-1,cur+n));render()}
function addOne(){const v=[i1,i2,i3,i4].map(e=>e.value.trim());if(!v[0])return;data.push({idiom:v[0],meaning:v[1],bn:v[2],example:v[3],ssc:0,others:0});[i1,i2,i3,i4].forEach(e=>e.value="");save();dlg.close();render()}
function csv(t){return t.trim().split(/\r?\n/).map(l=>{const r=[];let c="",qt=0;for(const ch of l){if(ch=='"')qt=!qt;else if(ch==","&&!qt){r.push(c);c=""}else c+=ch}r.push(c);return r})}
function upl(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{let items;
if(f.name.endsWith(".json")){items=JSON.parse(r.result)}else{const rows=csv(r.result);const h=rows[0].map(x=>x.trim().toLowerCase());const hasH=h.includes("idiom");items=rows.slice(hasH?1:0).map(c=>({idiom:c[0],meaning:c[1],bn:c[2],example:c[3],ssc:+c[4]||0,others:+c[5]||0}))}
items=items.filter(x=>x&&x.idiom);data=data.concat(items);save();dlg.close();render()}catch(e){alert("File পড়া যায়নি")}};r.readAsText(f)}
function reset(){if(confirm("সব মুছে শুধু ২১টা idiom রাখবো?")){data=base;save();dlg.close();render()}}
render();
</script></body></html>
